apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example
  namespace: argocd
  annotations:
    documentation: "https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#applications"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    path: 'overlays/dev'
    repoURL: 'https://github.com/nkzk/example-project-gitops.git'
    targetRevision: HEAD
  project: 'example-project'